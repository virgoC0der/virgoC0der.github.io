{{ if and (eq .Kind "page") (eq .Section "posts") }}
<script>
(function () {
  var bar = document.querySelector('.reading-progress .bar > div');
  var label = document.querySelector('.reading-progress .text');
  if (!bar) return;
  function upd() {
    var h = document.documentElement;
    var b = document.body;
    var st = h.scrollTop || b.scrollTop;
    var sh = (h.scrollHeight || b.scrollHeight) - h.clientHeight;
    var p = sh > 0 ? Math.min(100, Math.max(0, (st / sh) * 100)) : 0;
    bar.style.width = p.toFixed(0) + '%';
    if (label) {
      var remain = Math.max(0, Math.round((100 - p) / 10));
      label.textContent = '当前进度 — 翻到 ' + p.toFixed(0) + '%，还需 ~' + remain + ' 分钟';
    }
  }
  window.addEventListener('scroll', upd, { passive: true });
  window.addEventListener('resize', upd);
  upd();
})();
</script>
{{ end }}
