{{- /*
  Args via dict: size (default 140), pose (wave|think|code|sit|peek), animated (bool)
*/ -}}
{{- $size := default 140 .size -}}
{{- $pose := default "wave" .pose -}}
{{- $anim := default false .animated -}}
<svg viewBox="0 0 140 140" width="{{ $size }}" height="{{ $size }}" style="display:block">
  <ellipse cx="70" cy="128" rx="38" ry="4" fill="rgba(0,0,0,0.15)"/>
  <g{{ if $anim }} class="wiggle"{{ end }}>
    <rect x="52" y="108" width="10" height="14" rx="5" fill="#cfc2f1" stroke="#151415" stroke-width="2.2"/>
    <rect x="78" y="108" width="10" height="14" rx="5" fill="#cfc2f1" stroke="#151415" stroke-width="2.2"/>
    <ellipse cx="57" cy="122" rx="8" ry="3.5" fill="#151415"/>
    <ellipse cx="83" cy="122" rx="8" ry="3.5" fill="#151415"/>
    <path d="M32 78 Q32 48 70 48 Q108 48 108 78 L108 106 Q108 116 96 116 L44 116 Q32 116 32 106 Z"
          fill="#e5d7ff" stroke="#151415" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M55 90 Q70 104 85 90 L85 112 Q70 116 55 112 Z" fill="#fdfcf5" stroke="#151415" stroke-width="2"/>

    {{- if eq $pose "wave" -}}
    <path d="M34 80 Q22 72 26 58 Q28 54 32 56" fill="none" stroke="#151415" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="26" cy="56" r="5" fill="#e5d7ff" stroke="#151415" stroke-width="2.2"/>
    <path d="M106 86 Q118 86 120 96" fill="none" stroke="#151415" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="120" cy="96" r="5" fill="#e5d7ff" stroke="#151415" stroke-width="2.2"/>
    {{- else if eq $pose "think" -}}
    <path d="M34 86 Q22 92 26 104" fill="none" stroke="#151415" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="26" cy="104" r="5" fill="#e5d7ff" stroke="#151415" stroke-width="2.2"/>
    <path d="M106 82 Q118 72 112 60" fill="none" stroke="#151415" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="112" cy="60" r="5" fill="#e5d7ff" stroke="#151415" stroke-width="2.2"/>
    {{- else if eq $pose "code" -}}
    <path d="M36 84 Q46 96 56 92" fill="none" stroke="#151415" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M104 84 Q94 96 84 92" fill="none" stroke="#151415" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="50" y="88" width="40" height="16" rx="2" fill="#151415" stroke="#151415" stroke-width="2"/>
    <rect x="52" y="90" width="36" height="10" fill="#b5f26a"/>
    <text x="54" y="98" font-family="JetBrains Mono, monospace" font-size="6" fill="#151415" font-weight="700">go run.</text>
    {{- else if eq $pose "peek" -}}
    <path d="M50 84 Q56 100 70 100 Q84 100 90 84" fill="none" stroke="#151415" stroke-width="2.6" stroke-linecap="round"/>
    {{- else -}}
    <path d="M36 90 Q30 100 38 108" fill="none" stroke="#151415" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M104 90 Q110 100 102 108" fill="none" stroke="#151415" stroke-width="2.6" stroke-linecap="round"/>
    {{- end -}}

    <ellipse cx="58" cy="74" rx="7" ry="8" fill="#fdfcf5" stroke="#151415" stroke-width="2.2"/>
    <ellipse cx="82" cy="74" rx="7" ry="8" fill="#fdfcf5" stroke="#151415" stroke-width="2.2"/>
    <circle cx="59" cy="76" r="3.2" fill="#151415"/>
    <circle cx="83" cy="76" r="3.2" fill="#151415"/>
    <circle cx="60.5" cy="74.5" r="1.1" fill="#fdfcf5"/>
    <circle cx="84.5" cy="74.5" r="1.1" fill="#fdfcf5"/>
    <ellipse cx="48" cy="82" rx="3.5" ry="2" fill="#ef7065" opacity="0.6"/>
    <ellipse cx="92" cy="82" rx="3.5" ry="2" fill="#ef7065" opacity="0.6"/>
    <path d="M64 86 Q70 92 76 86" fill="none" stroke="#151415" stroke-width="2" stroke-linecap="round"/>

    <g transform="translate(70 32)">
      <path d="M0 -18 L4 -6 L16 -6 L6 2 L10 14 L0 6 L-10 14 L-6 2 L-16 -6 L-4 -6 Z"
            fill="#f5dc5a" stroke="#151415" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="-0.5" cy="-1" r="1.5" fill="#151415"/>
    </g>
    <path d="M70 48 L70 42" stroke="#151415" stroke-width="2" stroke-linecap="round"/>

    <g transform="translate(70 102)" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#151415" text-anchor="middle">
      <text y="0">♍</text>
    </g>
  </g>

  <g opacity="0.8">
    <path d="M20 36 L22 40 L26 42 L22 44 L20 48 L18 44 L14 42 L18 40 Z" fill="#ef7065" stroke="#151415" stroke-width="1.2"/>
    <path d="M118 24 L119.5 27 L122.5 28.5 L119.5 30 L118 33 L116.5 30 L113.5 28.5 L116.5 27 Z" fill="#f5dc5a" stroke="#151415" stroke-width="1.2"/>
  </g>
</svg>
