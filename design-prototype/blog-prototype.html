<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Billy's Blog — PostHog-style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --yellow: #f5dc5a;
    --yellow-soft: #fce992;
    --coral: #ef7065;
    --coral-soft: #f4a39b;
    --cream: #eeefe9;
    --cream-warm: #f7f4e9;
    --paper: #fdfcf5;
    --ink: #151415;
    --ink-soft: #3a3736;
    --mute: #6a6664;
    --line: #151415;
    --blue: #1d4aff;
    --lime: #b5f26a;
    --lavender: #cfc2f1;
    --peach: #fbcfb8;
    --mint: #a9e6c9;
    --pink: #f6b6d1;
    --radius: 6px;
    --shadow-sm: 3px 3px 0 var(--line);
    --shadow: 5px 5px 0 var(--line);
    --shadow-lg: 8px 8px 0 var(--line);
    --shadow-xl: 12px 12px 0 var(--line);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    font-feature-settings: 'ss01', 'cv11';
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font-family: inherit; }
  /* paper grain for the whole page */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(20,20,20,0.04) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    z-index: 1000;
    mix-blend-mode: multiply;
  }

  /* headline display font */
  .display {
    font-family: 'Fraunces', 'Noto Sans SC', serif;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 0.95;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* card with brutal border + shadow */
  .brutal {
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* selection */
  ::selection { background: var(--yellow); color: var(--ink); }

  /* hide scrollbars inside artboards */
  .artboard-scroll::-webkit-scrollbar { width: 8px; }
  .artboard-scroll::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 4px; }

  /* animations */
  @keyframes wiggle {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }
  @keyframes blink { 0%, 90%, 100% { opacity: 1; } 95% { opacity: 0; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .wiggle { animation: wiggle 3s ease-in-out infinite; }
  .cursor-blink::after { content: '▊'; animation: blink 1.1s step-end infinite; margin-left: 2px; }

  /* dashed divider */
  .dashed-border { background-image: linear-gradient(90deg, var(--line) 50%, transparent 50%); background-size: 12px 2px; background-repeat: repeat-x; background-position: 0 50%; height: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Tweak defaults -->
<script>
  window.__TWEAKS = /*EDITMODE-BEGIN*/{
    "variant": "A",
    "scanlines": true,
    "mascotEnabled": true
  }/*EDITMODE-END*/;
</script>

<script type="text/babel" src="posts-data.jsx"></script>

</html>
