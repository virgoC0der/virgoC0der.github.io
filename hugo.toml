baseURL = 'https://www.giantough.top/'
languageCode = 'zh-CN'
languageName = "简体中文"
title = "Billy's Blog"
theme = 'posthog-blog'

enableRobotsTXT = true

# /llms.txt：给 AI 搜索/LLM 读的站点索引（由 layouts/index.llms.txt 从内容生成）
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]

# static/design-prototype/ 是 Claude Design 导出的设计原型，不发布到线上
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    excludeFiles = ["design-prototype", "design-prototype/**"]

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
  [markup.highlight]
    style = "tokyonight-night"
    noClasses = true
    lineNos = false
    codeFences = true
    guessSyntax = true

[menu]
  [[menu.main]]
    weight = 1
    identifier = "home"
    name = "~"
    url = "/"
  [[menu.main]]
    weight = 2
    identifier = "posts"
    name = "posts"
    url = "/posts/"
  [[menu.main]]
    weight = 3
    identifier = "tags"
    name = "tags"
    url = "/tags/"
  [[menu.main]]
    weight = 4
    identifier = "about"
    name = "about"
    url = "/about/"
  [[menu.main]]
    weight = 5
    identifier = "now"
    name = "now"
    url = "/now/"

